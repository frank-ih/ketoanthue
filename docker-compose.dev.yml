# Ketoanthue Development Docker Compose
# Uses localhost AgentClan services for development

services:
  # ── Ketoanthue Web (Next.js Chat Interface) ────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    environment:
      NEXT_PUBLIC_AGENTCLAN_API: ${NEXT_PUBLIC_AGENTCLAN_API}
      NEXT_PUBLIC_AGENTCLAN_TOKEN: ${NEXT_PUBLIC_AGENTCLAN_TOKEN}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  # ── Ketoanthue Backend API ─────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: postgresql://ketoanthue:ketoanthue@postgres:5432/ketoanthue
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PORT: "3001"
      AGENTCLAN_API_KEY: ${AGENTCLAN_API_KEY}
      AGENTCLAN_API_URL: ${AGENTCLAN_API_URL}
    ports:
      - "3001:3001"
    restart: unless-stopped

  # ── Infrastructure (local) ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ketoanthue
      POSTGRES_USER: ketoanthue
      POSTGRES_PASSWORD: ketoanthue
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ketoanthue -d ketoanthue"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis/redis-stack:latest
    ports:
      - "6379:6379"
      - "8001:8001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: